<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover lets the page paint edge to edge on a notched
         iPhone instead of letterboxing between two grey bars. It hands us
         responsibility for the insets in exchange; client/css/ios-chrome.css
         pays that with env(safe-area-inset-*). Both values are inert on a
         desktop browser, so this does not change the web-first layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>☁️ Cloude Code</title>

    <!-- iOS home-screen app chrome.
         WHAT THIS ACTUALLY BUYS OVER PLAIN HTTP: iOS "Add to Home Screen"
         reads these tags with no secure-context requirement, so the icon,
         the standalone (chrome-less) window and the status bar style all
         work on a Tailscale http:// origin. What does NOT work over plain
         http is anything gated on window.isSecureContext - service
         workers, Cache API, and therefore any offline/background story.
         There is deliberately NO service worker registered here: it would
         fail to register on this origin, and a registration that silently
         never takes is worse than none. See docs/ios-standalone.md. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent puts our own background under the status bar,
         which is why ios-chrome.css must pad the header by the top inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cloude">
    <!-- The app version, stamped server-side by src/main.py's
         `{{VERSION}}` substitution. It used to be a `<span class="version">`
         chip inside the header `<h1>`; it now renders in the home screen's
         bottom bar, which is built by launchpad.js at runtime and so has
         no server-rendered markup of its own to stamp. A meta tag is the
         handoff: main.py's replace() is a plain string substitution and
         does not care where the token lives, and Launchpad reads it back
         with one querySelector. Empty content means the version could not
         be resolved, and the chip renders nothing at all. -->
    <meta name="cloude-app-version" content="{{VERSION}}">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- iOS ignores manifest icons and reads this instead. PNG only. -->
    <link rel="apple-touch-icon" href="/static/assets/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/assets/icons/icon-192.png">

    <!-- Vendored xterm.js CSS (see client/vendor/xterm/VERSION.md) - served
         from this app's own origin instead of cdn.jsdelivr.net. A CDN
         request blocked or delayed by an ad blocker (Brave Shields on
         mobile, confirmed) leaves xterm's character-measurement element
         without its rules; the backend pane size still comes out right,
         so only the on-device render breaks. Same-origin removes the
         failure class instead of hoping the CDN answers. Must load in
         <head>, before styles.css, so app CSS can still override xterm's
         defaults. -->
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css" />
    <!-- v0.7.0 Part 2: toast notification styles. Loaded after styles.css so
         theme CSS custom properties (--color-accent, etc.) are available
         as fallbacks for the per-toast accent border. -->
    <link rel="stylesheet" href="/static/css/toast.css" />
    <!-- Session sidebar. Loaded after styles.css for the same
         token-availability reason as toast.css. -->
    <link rel="stylesheet" href="/static/css/session-sidebar.css" />
    <!-- The status dot, in its own file because it is SHARED by three
         surfaces - the sidebar, the launchpad's running-sessions list
         and the home project tree - so a file named for one of them was
         never its home. Its vocabulary is defined in
         client/js/session-status-ui.js. -->
    <link rel="stylesheet" href="/static/css/status-dot.css" />
    <!-- Row density, the per-row reorder/pin controls, and the two
         three-outcome blocks the list can render instead of rows. Its own
         file so session-sidebar.css stays under the 500-line convention;
         it must load AFTER it, because the density rules override the
         base row padding there. -->
    <link rel="stylesheet" href="/static/css/session-sidebar-density.css" />
    <link rel="stylesheet" href="/static/css/session-sidebar-groups.css" />
    <!-- Session tools button + menu and the per-session theme picker.
         After styles.css so it inherits the theme vars, AND so its
         explicit width/height beat the bare `button` base rule there. -->
    <link rel="stylesheet" href="/static/css/terminal-tools.css" />
    <!-- The copy-output sheet those tools open. Split from
         terminal-tools.css at the 500-line limit; same load reasoning. -->
    <link rel="stylesheet" href="/static/css/copy-output.css" />
    <!-- The paste fallback the "paste from clipboard" tool opens when the
         origin is not a secure context. Same load reasoning again. -->
    <link rel="stylesheet" href="/static/css/paste-fallback.css" />
    <!-- Stacked-modal chrome (scroll lock + what a COVERED modal looks
         like). Must load before the two config-editor stylesheets, which
         style the modals that stack. -->
    <link rel="stylesheet" href="/static/css/modal-stack.css" />
    <link rel="stylesheet" href="/static/css/config-editor.css" />
    <!-- The file browser's BOX: right-hand drawer geometry, the docked
         (pinned) layout and the pin control. Must load AFTER
         config-editor.css, which owns everything inside the drawer. -->
    <link rel="stylesheet" href="/static/css/config-drawer.css" />
    <link rel="stylesheet" href="/static/css/config-editor-modal.css" />
    <!-- Mobile header dropdown (client/js/header-menu.js) and iOS
         safe-area chrome. Both load after styles.css: the first needs the
         theme custom properties, the second must win on equal specificity
         where it re-pads the header. -->
    <link rel="stylesheet" href="/static/css/header-menu.css" />
    <!-- The home screen's thin bottom bar. Must load BEFORE ios-chrome.css,
         which overrides its --home-bar-inset token with the real
         env(safe-area-inset-bottom) and excludes #launchpad-screen from the
         generic `.screen` bottom inset. -->
    <link rel="stylesheet" href="/static/css/home-bar.css" />
    <!-- STAGE C: the session-attribution prompt card. Loaded with the
         other home-screen stylesheets, before the theme tint and the
         screen chrome, so both can still win at equal specificity. -->
    <link rel="stylesheet" href="/static/css/attribution-prompt.css" />
    <link rel="stylesheet" href="/static/css/ios-chrome.css" />
    <!-- Two-line common-command chips. After styles.css, which owns the
         base .command-button rule this narrows. -->
    <link rel="stylesheet" href="/static/css/slash-command-chips.css" />

    <!-- The settings panel's music volume slider. After styles.css, which
         owns the .settings-field rules this builds on. -->
    <link rel="stylesheet" href="/static/css/settings-audio.css" />

    <!-- The global audio on/off control (client/js/globalAudioToggle.js),
         re-parented between .home-bar and .info by app.js. Self-contained:
         it never edits home-bar.css/terminal-tools.css/styles.css, only
         adds rules scoped under its own .global-audio-btn class. -->
    <link rel="stylesheet" href="/static/css/global-audio.css" />

    <!-- The home bar's server-status panel. After styles.css, which owns
         the .modal-overlay / .modal-header / .modal-body chrome it rides
         on and the bare `button` reset its controls have to escape. -->
    <link rel="stylesheet" href="/static/css/server-status.css" />

    <!-- Session rows painted in their own session's theme colours. MUST be
         the last of the app stylesheets: it competes at equal specificity
         with the row backgrounds in styles.css and session-sidebar.css, so
         source order is what decides whether the wash survives a hover. -->
    <link rel="stylesheet" href="/static/css/session-theme-tint.css" />

    <!-- Authenticated-only chrome, hidden by default. Deliberately near
         the end so nothing later in the app's own stylesheets can win at
         equal specificity; see the file for why the default is inverted
         rather than enumerated in app.js. -->
    <link rel="stylesheet" href="/static/css/screen-chrome.css" />

    <!-- Terminal surface translucency (matches the animated theme
         background's status attribute; see the file for why this wins
         over styles.css's `#terminal` rule by specificity, not order). -->
    <link rel="stylesheet" href="/static/css/terminal-opacity.css" />
</head>
<body>
    <!-- Item 9: deep-link error banner. Populated by router.js when the
         URL contains `/session/<invalid>`. Hidden by default. -->
    <div id="deep-link-error" style="display:none; background:#c00; color:#fff; padding:8px; text-align:center"></div>

    <div class="header">
        <!-- HOME-HEADER-CONSOLIDATION: `.header-row` wraps the original
             three header children (toggle / title / controls) so
             `#home-subheader` below can be a second row of `.header`
             WITHOUT becoming a sibling h1 has to measure itself against.
             header-title-fit.js's slotWidth() walks h1's actual parent's
             children to compute the title's shrink budget, on the
             documented assumption that every sibling there is
             fixed-size and in the same row (see its doc comment). Before
             this wrapper existed, `#home-subheader` WAS that parent's
             child too, and its outerWidth (a full-width second row) was
             being subtracted from the budget, driving it negative — the
             function's `avail > 0` guard then silently fell back to
             "assume it fits" and CSS `text-overflow: ellipsis` alone was
             left to truncate mid-word ("Cloude Code L…" at 390px,
             confirmed by screenshot, not caught by the numeric centring
             check because a 2-character remainder still centres at 0px
             offset). The wrapper keeps h1's actual parent to exactly the
             three original elements, restoring the function's own stated
             invariant instead of teaching it a second layout mode. -->
        <div class="header-row">
        <!-- HOME-HEADER-CONSOLIDATION: real, visible (but
             visibility:hidden — takes layout space, invisible to the eye
             AND to a screen reader) spacer, exactly mirroring `.controls`'
             width. `display:none` outside `.header--home` so it never
             touches the terminal/auth layout.
             WHY A REAL ELEMENT INSTEAD OF A CSS GRID COLUMN: CSS Grid's
             `minmax(X, 1fr)` reserves X of track space with NO element
             sitting in it, which header-title-fit.js's slotWidth() cannot
             see — it walks `.header-row`'s actual DOM children and sums
             their rendered widths, so an empty grid track is invisible to
             it. That mismatch once let the JS module conclude the full
             title fit (its math never subtracted the reserved-but-empty
             column) while the grid rendered it only 160px of room —
             CSS `text-overflow: ellipsis` silently clipped the DOM's
             correct, untruncated text to "Cloude Code L…" and nothing
             in the DOM said so. A real sibling element is not just seen
             by the browser's layout, it is seen by this exact code path,
             so the two can never disagree. -->
        <div class="header-home-spacer" aria-hidden="true"></div>
        <!-- Session sidebar hamburger - top-left of the terminal screen
             header. Hidden on auth/launchpad (toggled by app.js exactly
             like logoutBtn/destroyBtn). A real <button> with
             aria-expanded/aria-controls per the accessibility pattern
             already established for header controls in this file. -->
        <button type="button" id="session-sidebar-toggle" class="session-sidebar-toggle hidden"
                data-auth-only
                aria-expanded="false" aria-controls="session-sidebar-panel"
                aria-label="Conversations" title="conversations">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <h1 id="appTitle">
            <!-- fix/icon-consistency — ships the real brand mark inline so
                 it is correct on FIRST PAINT, before app.js (loaded near
                 the end of body) has run. app.js's HEADER_BRAND_ICON_URL /
                 HEADER_BRAND_ICON_URL_2X are the single source of truth
                 for the paths; this src/srcset is a literal copy of them
                 and tests/test_icon_assets.py asserts they match.
                 fix/real-app-icon-art — these are raster PNGs cropped
                 straight from macOS/assets/AppIcon-1024.png (the real
                 rendered cloud + pixel-face artwork), not the vector
                 approximation that used to live at
                 client/assets/cloude-icon.svg. aria-hidden because the
                 adjacent #header-title-text span already names the app in
                 text for assistive tech — the icon is a decorative echo of
                 that name, not an independent label. data-brand-icon lets
                 setHeaderIdentity() (app.js) recognise this is already the
                 real mark and skip re-writing it. -->
            <span id="header-icon" class="header-icon" aria-hidden="true"><img data-brand-icon src="/static/assets/icons/header-icon.png" srcset="/static/assets/icons/header-icon.png 1x, /static/assets/icons/header-icon@2x.png 2x" alt="" /></span>
            <span id="header-title-text">Cloude Code</span>
            <!-- LAUNCHER HELP, BESIDE THE TITLE. Moved here out of
                 `.controls` (see the note there). It toggles the SAME
                 help div it always did - the <details> that is still the
                 first child of `.launchpad-container`, still rendered by
                 launchpad.js, still exactly where it was on screen. Only
                 the control moved; the panel did not.
                 WHY INSIDE THE h1 RATHER THAN A SIBLING OF IT: `#appTitle`
                 is the flex box that `.header--home` centres, so a child
                 of it rides that centring for free and stays glued to the
                 title text at every width. A sibling would be centred
                 independently and would drift away from the text as the
                 title shrank.
                 `flex-shrink: 0` in styles.css keeps it off the title's
                 elision budget, and header-title-fit.js subtracts every
                 non-shrinking element inside `#appTitle` from that budget
                 (see its slotWidth()), so the text still middle-elides at
                 the right width instead of being silently clipped.
                 Carries `.btn-icon` - see the white-square note in
                 styles.css. Home screen only, still gated on
                 `.header--home` there, so no screen-switch code has to
                 remember it. -->
            <button type="button" id="launchpad-help-btn" class="btn-icon" aria-label="help" title="help" data-tooltip="Help" aria-expanded="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4"/>
                    <line x1="12" y1="17.5" x2="12" y2="17.5"/>
                </svg>
            </button>
            <!-- NO VERSION CHIP HERE ANY MORE. It moved to the home
                 screen's bottom bar (client/css/home-bar.css). It was a
                 fixed-width, flex-shrink: 0 sibling of the title, so every
                 pixel it occupied came straight off the title's truncation
                 budget on every screen including the terminal, where the
                 title is a session name that needs the room. See
                 client/js/header-title-fit.js, which subtracts each
                 non-shrinking sibling from the budget and therefore
                 recovers this width with no code change. -->
        </h1>
        <div class="controls">
            <!-- Logout: door frame (three-sided bracket, open on the right)
                 with an arrow passing all the way THROUGH and past it — the
                 near-universal "log out" glyph. Deliberately different from
                 detach above (see its comment). -->
            <!-- NO INLINE onclick HERE, AND ADDING ONE BACK BREAKS THE
                 BUTTON SILENTLY. src/main.py stamps
                 `script-src 'self'` on every response, which forbids
                 inline event handlers. This button carried
                 `onclick="App.logout()"` from the initial commit and
                 kept it when CSP landed, so from that day the click did
                 nothing at all: the browser refused to run the handler
                 and logged a CSP violation, which is not an exception,
                 not a visible error, and not something any DOM test can
                 see. The element was present, sized, visible and
                 unobstructed the whole time. It is wired in
                 client/js/app.js's setupEventListeners() now, exactly
                 like #settingsBtn and #configEditorBtn beside it.
                 scripts/verify_logout_chrome.py drives this against the
                 REAL server so the CSP header is actually present - a
                 static harness has no CSP and passes either way. -->
            <button id="logoutBtn" class="hidden" aria-label="Logout" title="logout" data-tooltip="Logout">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M7 2.5H3.75C3.05964 2.5 2.5 3.05964 2.5 3.75V12.25C2.5 12.9404 3.05964 13.5 3.75 13.5H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6.25 8H13.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M10.5 5.25L13.25 8L10.5 10.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <!-- Settings: gear/cog — a ring with six radial teeth, the one
                 icon in this family built from a circle rather than a
                 closed silhouette (house/box/door/trash) or an open
                 speaker-shape, so it reads as structurally distinct from
                 all five neighbors at a glance. Opens SettingsPanel (see
                 client/js/settings-panel.js), which now owns the theme
                 chooser that used to live directly in this header — see
                 that file for why it mounts ThemeSelector into the panel
                 instead of `.header .controls`. Always visible (not
                 gated behind session state like home/detach/logout)
                 because settings apply whether or not a session is open. -->
            <button type="button" id="settingsBtn" class="hidden" aria-label="Settings" title="settings" data-tooltip="Settings">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <circle cx="8" cy="8" r="4.2" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="8" cy="8" r="1.6" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 3.8V2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11.64 5.9L13.02 5.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M11.64 10.1L13.02 10.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8 12.2V13.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M4.36 10.1L2.98 10.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M4.36 5.9L2.98 5.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <!-- Config editor: browse/edit ~/.claude (+ the active project's
                 .claude/) — see client/js/config-editor-panel.js. Same
                 always-visible treatment as settingsBtn: config applies
                 whether or not a session is open. Icon is an open folder,
                 distinct from settings' gear-circle and every other glyph
                 in this row. -->
            <button type="button" id="configEditorBtn" class="btn-icon hidden" aria-label="File editor" title="file editor" data-tooltip="file editor" aria-expanded="false" aria-controls="config-editor-panel">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 5.25C2 4.69772 2.44772 4.25 3 4.25H6.5L7.75 5.75H13C13.5523 5.75 14 6.19772 14 6.75V11.25C14 11.8023 13.5523 12.25 13 12.25H3C2.44772 12.25 2 11.8023 2 11.25V5.25Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </button>
            <!-- THE LAUNCHER HELP BUTTON IS NOT IN THIS ROW ANY MORE.
                 It now sits inside #appTitle, immediately right of the
                 title text - see there. It was moved out of .controls on
                 purpose and must not be put back: .controls is the
                 header's RIGHT flank, and .header--home sizes
                 #header-home-spacer to mirror that flank's width so the
                 title lands on the real centre. The flank token
                 (--home-header-flank-w) budgets TWO inline controls
                 (#configEditorBtn and the kebab #header-menu-toggle);
                 a third inline child here on the home screen made the
                 right flank wider than the spacer it was supposed to
                 equal, which pushed the title off centre by half the
                 difference. -->
            <!-- NO CONNECTION LIGHT IN THIS ROW ANY MORE. It used to be
                 the last child here. It is now a bottom-bar control,
                 never a header one - see .info near the end of this file
                 (#terminal-bar-status inside it) and App._placeStatusLight().
                 Do not put it back: the header row is actions, and the
                 light is state. -->
        </div>
        </div><!-- /.header-row -->
        <!-- HOME-HEADER-CONSOLIDATION: launchpad-only second header row.
             Replaces the standalone `.launchpad-header` / `.launchpad-prompt`
             block that used to sit at the top of `.launchpad-container` —
             the title moved into the header itself (see #appTitle above,
             painted "Cloude Code Launcher" by App.showLaunchpad()) and this
             is its subheading, directly below. Hidden and un-classed
             (`.header--home` off) on every other screen by
             setHeaderIdentity() in app.js — see its doc comment. Spans the
             full header width and is centred by `.header--home` grid rules
             in styles.css, not by a fixed margin, so it stays centred at
             every viewport width including under the FAB/controls cluster
             at 390px. -->
        <div id="home-subheader" class="home-subheader" hidden></div>
    </div>
    <!-- New-action speed-dial FAB markup is now injected inline into the
         launchpad's "running sessions" section heading by launchpad.js
         (renderLaunchpadUI). The full-screen click-outside backdrop stays
         here at top-level so it can blanket the viewport when open. -->
    <div class="new-fab__backdrop" id="new-fab-backdrop" hidden></div>

    <!-- Session sidebar - conversation switcher for the terminal view.
         Markup lives at body level (not inside #terminal-screen) so it can
         slide over the full viewport; visibility is CSS-driven by the
         .session-sidebar-panel--open class (client/js/session-sidebar.js). -->
    <div class="session-sidebar-backdrop" id="session-sidebar-backdrop" hidden></div>
    <aside id="session-sidebar-panel" class="session-sidebar-panel" aria-hidden="true"
           aria-label="Conversations" data-density="cozy">
        <div class="session-sidebar-header">
            <!-- THE HEADING IS A CLUSTER, NOT A TITLE PLUS STRAYS.
                 "we need to push it closer to the title conversations we
                 will probably add more icons later on." The density
                 control used to carry `margin-left: auto` and float away
                 to the far right beside the panel's own pin and close
                 buttons, so it read as panel chrome rather than as a
                 control over the list. It now sits inside
                 `.session-sidebar-tools`, immediately after the title.

                 ADDING THE NEXT CONTROL IS ONE ELEMENT, NOT A LAYOUT
                 CHANGE: append another sibling inside
                 `.session-sidebar-tools`. The cluster is a flex row with
                 its own gap, the heading owns `min-width: 0` so the title
                 gives way before the tools do, and `.session-sidebar-
                 actions` on the right takes the leftover space - so no
                 `margin-left: auto` has to be moved from one control to
                 another the way it did last time. See
                 client/css/session-sidebar-groups.css. -->
            <div class="session-sidebar-heading">
                <span class="session-sidebar-title">conversations</span>
                <div class="session-sidebar-tools" role="group" aria-label="List controls">
            <!-- Row detail (density). "a little icon dropdown for how
                 verbose" - thin rows to see more, or more per row. The
                 three modes and the persistence live in
                 client/js/session-sidebar-density.js; the menu below is
                 keyboard-operable (arrows move, Enter chooses, Escape
                 leaves) because a control only reachable by mouse is not
                 a control this list can rely on. -->
            <div class="session-sidebar-density-wrap">
                <button type="button" id="session-sidebar-density" class="session-sidebar-density"
                        aria-haspopup="true" aria-expanded="false"
                        aria-controls="session-sidebar-density-menu"
                        aria-label="Row detail: cozy. Change how much each session row shows."
                        title="row detail: cozy">
                    <!-- A DENSITY GLYPH, NOT A SECOND HAMBURGER. This was
                         three evenly stroked lines - byte-for-byte the
                         same mark as #session-sidebar-toggle, the button
                         that OPENS this panel, sitting 300px away in the
                         same viewport. Two different controls drawn
                         identically is not a weak icon, it is a wrong
                         one.
                         This is three FILLED bars of decreasing height:
                         rows getting thinner, which is literally what the
                         control does. Authored here, generic, and
                         deliberately not a trace of anyone's mark. Filled
                         rather than stroked so it cannot be confused with
                         the stroked hamburger even at a glance. -->
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"
                         aria-hidden="true">
                        <rect x="3" y="4" width="18" height="5" rx="1.5"/>
                        <rect x="3" y="11.25" width="18" height="3.5" rx="1.2"/>
                        <rect x="3" y="17" width="18" height="2" rx="1"/>
                    </svg>
                </button>
                <div id="session-sidebar-density-menu" class="session-sidebar-density-menu"
                     role="menu" aria-label="Row detail" hidden>
                    <button type="button" role="menuitemradio" aria-checked="false"
                            data-density-mode="compact" class="session-sidebar-density-item">
                        <span class="session-sidebar-density-item__label">compact</span>
                        <span class="session-sidebar-density-item__hint">thinnest rows, most sessions on screen</span>
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="true"
                            data-density-mode="cozy" class="session-sidebar-density-item">
                        <span class="session-sidebar-density-item__label">cozy</span>
                        <span class="session-sidebar-density-item__hint">the default row</span>
                    </button>
                    <button type="button" role="menuitemradio" aria-checked="false"
                            data-density-mode="detailed" class="session-sidebar-density-item">
                        <span class="session-sidebar-density-item__label">detailed</span>
                        <span class="session-sidebar-density-item__hint">adds agent family and age on a second line</span>

         modules below only declare their own rows.

         Both must load AFTER anchor-popover.js (placement), copy-output.js,
         clipboard.js and session-theme-menu.js, whose exported functions
         their rows call. terminal.js hands each of them the Terminal
         wrapper from _applyTerminalTools() / _applySessionEditor(). -->
    <script src="/static/js/fab-menu.js"></script>
    <!-- The paste fallback. Called by clipboard.js at runtime only, so
         the order between the two does not matter, but it must load
         after fab-menu.js whose notify() it reports through. -->
    <script src="/static/js/paste-fallback.js"></script>
    <script src="/static/js/terminal-tools-menu.js"></script>
    <script src="/static/js/session-editor-menu.js"></script>
    <!-- The home bar's server-controls menu. Same shared plumbing, but
         APP-scoped rather than session-scoped, which is why it mounts on
         the home screen and the two above do not. Must load after
         fab-menu.js and anchor-popover.js; launchpad.js wires it on
         render, so the order relative to launchpad.js does not matter. -->
    <!-- The server-status panel behind that menu's first row. Split in
         two: the format module is pure and testable with no DOM, the
         panel owns the fetch, the overlay and the one destructive
         control. Must load BEFORE server-controls-menu.js only in the
         sense that the row calls window.ServerStatusPanel lazily on
         click, so strict order is not required - but keeping them
         adjacent is how the pair stays findable. Both need api.js
         (loaded far above) and session-row-actions.js, which owns the
         confirmation copy and the two destruction endpoints. -->
    <script src="/static/js/server-status-format.js"></script>
    <script src="/static/js/server-status-panel.js"></script>
    <script src="/static/js/server-controls-menu.js"></script>

    <!-- App Controller (extracted for CSP compliance) -->
    <script src="/static/js/app.js"></script>

    <!-- v0.7.0 Part 2 — toast notifications container. Fixed top-right via
         CSS (toast.css). aria-live=polite so screen readers announce new
         toasts without interrupting current UI focus. Toast cards are
         appended here by client/js/toast.js (ToastManager). -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- THE TWO SESSION-SCOPED FAB MENUS, split by JOB and by how often
         you reach for them.

         TERMINAL TOOLS (bottom row, slot 0, the right edge) moves content
         across the terminal's boundary: copy output, paste from
         clipboard, attach image. It stays on the bottom row with the
         d-pad, over the command line, because it is used all day.

         SESSION EDITOR (top-right rail) configures the session itself:
         theme and music. Set once per session, so it is out of the
         working row entirely. Two coherent groups with a rule a user can
         learn, not one drawer of everything.

         Both are direct children of <body>. NOTHING may move inside
         #terminal: TerminalScroll.blockOverscrollEscape calls
         preventDefault on single-touch drags there, so a control mounted
         inside it loses its gestures.

         The hidden file input is the "attach file" path, opened
         programmatically by that menu row; the change handler lives in
         clipboard.js (ClipboardTools.wireFileInput).

         Icon geometry is the terminal-tool set exactly: 16x16 in a
         0 0 16 16 viewBox with stroke-width declared PER PATH. A
         presentation attribute on the path beats a stylesheet rule that
         targets the svg, so the value has to be right here. -->
    <input type="file" id="cloude-image-attach-input" hidden />

    <!-- THE ONE #statusText NODE STARTS HERE AND NEVER STAYS.
         App._placeStatusLight() moves it into #home-bar-status (home
         screen) or #terminal-bar-status (terminal screen, inside the
         real `.info` bar - see index.html and terminal-tools.css) the
         moment a screen shows. There used to be a `position: fixed`
         chip parked here as its own floating "bar"; it is gone, because
         it was not a bar, it was a chip that happened to sit at a
         fixed screen position. This bare span is just the node's
         starting point before the first _placeStatusLight() call runs.
         Auth screen: neither destination is inside its DOM, so the
         node just sits here, unattached and invisible, until a real
         screen claims it - the auth screen reports its own server
         failures inline and was never meant to show a light. -->
    <span class="status" id="statusText" data-status="Ready" tabindex="0"
          role="status" aria-live="polite" aria-label="Ready"></span>

    <!-- Clipboard glyph: all three rows are content crossing the boundary. -->
    <button type="button" id="terminalToolsBtn" class="fab-menu-btn terminal-tools-fab"
            aria-haspopup="menu" aria-expanded="false" aria-controls="terminalToolsMenu"
            aria-label="terminal tools" title="terminal tools">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M5.5 2.5h-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-10a1 1 0 0 0-1-1h-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="5.5" y="1.5" width="5" height="2.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 8h4M6 10.5h2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </button>

    <!-- Sliders glyph: this one CONFIGURES rather than moves anything. -->
    <button type="button" id="sessionEditorBtn" class="fab-menu-btn session-editor-fab"
            aria-haspopup="menu" aria-expanded="false" aria-controls="sessionEditorMenu"
            aria-label="session editor" title="session editor">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 4.5h5M10 4.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M2 11.5h4M9 11.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8.5" cy="4.5" r="1.6" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="7.5" cy="11.5" r="1.6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>
</body>
</html>
