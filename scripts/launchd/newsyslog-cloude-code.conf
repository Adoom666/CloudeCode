# newsyslog.d rotation policy for the CloudeCode launchd sink.
#
# com.imc.cloude-code's plist points BOTH StandardOutPath and
# StandardErrorPath at launchd.log (see scripts/launchd/cloude-code.sh and
# ~/Library/LaunchAgents/com.imc.cloude-code.plist). Nothing in the app or
# the wrapper ever rotated it, so it grew unbounded (159 MB and climbing as
# of 2026-08-19, roughly 44% of recent lines being idle_watcher.poll_suppressed
# debug spam - see the LOG_LEVEL fix in src/main.py / src/config.py for the
# noise side of this problem; this file only addresses growth).
#
# Install (macOS-native mechanism, no custom rotator):
#   sudo cp scripts/launchd/newsyslog-cloude-code.conf \
#       /etc/newsyslog.d/com.imc.cloude-code.conf
#   sudo newsyslog -f /etc/newsyslog.d/com.imc.cloude-code.conf -F -v
#       (forces one immediate rotation so you can see it work; safe to run
#       any time - it only renames/compresses the log file, it never signals
#       or restarts the app process. Omit -F for a normal check-only run.)
#
# newsyslog itself runs automatically and periodically as
# /System/Library/LaunchDaemons/com.apple.newsyslog.plist (root LaunchDaemon,
# already present on every macOS install) - this file is the ONLY piece that
# needed adding.
#
# KNOWN LIMITATION, stated rather than hidden (three-outcome rule): the N
# flag below means newsyslog signals nobody after rotating. The CloudeCode
# process holds its stdout/stderr file descriptor open for its entire
# lifetime (launchd wires it up once, at exec time) and has no signal
# handler that reopens it, so between a rotation and the process's NEXT
# natural restart (crash, redeploy, manual relaunch), the running process
# keeps appending to the now-renamed-and-compressing-in-the-background
# file, not the fresh empty one newsyslog created. This is standard,
# expected behavior for any launchd stdout/stderr sink rotated this way
# (macOS gives no reopen-on-signal path for a plain redirected fd, unlike a
# syslog(3) client) - not a defect in this config. Growth control for the
# CURRENTLY running process resumes cleanly the next time it restarts;
# every future run after that rotates and stays bounded. Do not force a
# restart just to make this take effect immediately unless you mean to
# restart the app for its own sake.
#
# logfilename                                              owner:group      mode  count  size(KB)  when  flags
/Users/jsugamele/Library/Logs/cloude-code/launchd.log       jsugamele:staff  644   10     25600     *     ZN
