<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>login chrome harness</title>
<!--
  fix/login-chrome - MEASURE WHAT RENDERS, NOT WHAT THE DOM SAYS.

  The defect this harness exists for: on the LOGIN screen, the
  slash-commands button and the header kebab were both fully visible.
  Nothing in the DOM was wrong about either of them - the elements were
  correct, their markup was correct, their class lists were correct.
  The only witness is whether they occupy pixels, which is
  getBoundingClientRect() and getComputedStyle() in a real engine.
  A .classList.contains('hidden') assertion cannot see this class of bug
  at all, which is why this repo has shipped three separate visibly
  broken features through fully green DOM suites.

  Same pattern as tests/manual/header-icons-and-menu-harness.html: real
  client/css/*.css, real client/js modules, and the real header markup
  fetched out of client/index.html at load time so this page cannot drift
  from the shipped header the way a pasted copy would.

  It drives the REAL screen-state code path (window.ScreenChrome.apply,
  the same call App.showAuth()/showLaunchpad() make) rather than a local
  imitation of it, so a change to that policy is measured here rather
  than duplicated here.

  Serve over http from the repo root:
    http://127.0.0.1:<port>/tests/manual/login-chrome-harness.html
  A file:// origin cannot fetch client/index.html.

  Poll window.__loginChromeReady before measuring.
-->
<link rel="stylesheet" href="../../client/css/styles.css" />
<link rel="stylesheet" href="../../client/css/header-menu.css" />
<link rel="stylesheet" href="../../client/css/home-bar.css" />
<link rel="stylesheet" href="../../client/css/session-sidebar.css" />
<link rel="stylesheet" href="../../client/css/terminal-tools.css" />
<link rel="stylesheet" href="../../client/css/screen-chrome.css" />
</head>
<body>
<div id="harness-mount"></div>

<script>
window.__loginChromeReady = false;

/**
 * Description: pull the real `.header` block and the three screen divs
 *   out of the shipped client/index.html and mount them here, then boot
 *   the real modules that inject the rest of the chrome at runtime.
 * Inputs: none.
 * Output: Promise<void>; sets window.__loginChromeReady when done.
 */
async function boot() {
    const html = await (await fetch('../../client/index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const mount = document.getElementById('harness-mount');
    mount.appendChild(doc.querySelector('.header'));
    for (const id of ['auth-screen', 'launchpad-screen', 'terminal-screen']) {
        const el = doc.getElementById(id);
        if (el) mount.appendChild(el);
    }

    // The kebab (#header-menu-toggle) exists only because this module
    // creates it. That is exactly why it leaked: it is in no markup file
    // for anyone to remember to hide.
    await loadScript('../../client/js/dismiss-guard.js');
    await loadScript('../../client/js/header-menu.js');

    // The slash button, ditto, plus an inline display:flex written by
    // its own show(). Its two collaborators load first because the
    // module constructs them at import time.
    await loadScript('../../client/js/command-description.js');
    await loadScript('../../client/js/slash-command-filter.js');
    await loadScript('../../client/js/api.js');
    await loadScript('../../client/js/slash-favorites.js');
    await loadScript('../../client/js/slash-commands.js');
    window.SlashCommandsModal.createButton();
    window.SlashCommandsModal.show();

    await loadScript('../../client/js/dpad.js');
    window.DPad.init();
    window.DPad.show();

    await loadScript('../../client/js/screen-chrome.js');

    window.__loginChromeReady = true;
}

/**
 * Description: load one classic script and resolve when it has run.
 * Inputs: src (string) - relative url.
 * Output: Promise<void>.
 */
function loadScript(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('failed to load ' + src));
        document.head.appendChild(s);
    });
}

/**
 * Description: switch the harness to a screen using the REAL policy
 *   module, mirroring what App.showAuth()/showLaunchpad() do - stamp the
 *   marker and mark the screen div active.
 * Inputs: screen (string) - 'auth' | 'launchpad' | 'terminal'.
 * Output: void.
 */
window.__setScreen = function (screen) {
    for (const id of ['auth-screen', 'launchpad-screen', 'terminal-screen']) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('active', id === screen + '-screen');
    }
    // The three that ship class="hidden" are un-hidden once, exactly as
    // app.js does on every authenticated screen. The harness never
    // re-adds it, so any hiding measured below is the CSS gate doing the
    // work and not a leftover class.
    if (screen === 'auth' && window.__legacyShowAuth) {
        // THE RED PROOF, KEPT RUNNABLE. Replicates the PRE-FIX
        // App.showAuth() exactly: it named logout/settings/file-editor
        // and called SessionSidebar.hide() (which hides the toggle), and
        // that was the entire list.
        //
        // This half alone is NOT the pre-fix state and does not reproduce
        // anything: screen-chrome.css hides all of it with `!important`
        // whatever this list says, which is why --legacy exited 0 against
        // correct code for five days. The verifier now blanks that
        // stylesheet itself whenever --legacy is passed, so there is no
        // manual step left to forget and no way to run this flag against
        // a page where it cannot fail.
        for (const id of ['logoutBtn', 'settingsBtn', 'configEditorBtn',
                          'session-sidebar-toggle']) {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        }
    }
    if (screen !== 'auth') {
        for (const id of ['logoutBtn', 'settingsBtn', 'configEditorBtn', 'session-sidebar-toggle']) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }
    }
    window.ScreenChrome.apply(screen);
};

/**
 * Description: open the header overflow dropdown. #logoutBtn and
 *   #settingsBtn are re-parented INTO that panel by header-menu.js, so
 *   on an authenticated screen they are legitimately 0x0 until it is
 *   open - measuring them closed would read as a regression that is
 *   really just a collapsed menu.
 * Inputs: none.
 * Output: void.
 */
window.__openMenu = function () {
    if (window.HeaderMenu && !window.HeaderMenu.isOpen) window.HeaderMenu.open();
};

/**
 * Description: measure every app-chrome control as the eye sees it.
 * Inputs: none.
 * Output: object keyed by element id; each value is
 *   {present, w, h, display, visibility, opacity, visible} where
 *   `visible` is the pixel verdict, or {present: false} when the element
 *   does not exist at all. A missing element is reported as its own
 *   state, never folded into "not visible" - see the THREE-OUTCOME RULE.
 */
window.__chrome = function () {
    const ids = [
        'logoutBtn', 'settingsBtn', 'configEditorBtn',
        'header-menu-toggle', 'slash-commands-btn',
        'dpad-float-btn', 'session-sidebar-toggle',
        'appTitle'
    ];
    const out = { screen: document.body.dataset.screen || null,
                  isAuthenticated: document.body.classList.contains('is-authenticated') };
    for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) { out[id] = { present: false }; continue; }
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        out[id] = {
            present: true,
            w: r.width,
            h: r.height,
            display: cs.display,
            visibility: cs.visibility,
            opacity: cs.opacity,
            visible: r.width > 0 && r.height > 0 &&
                     cs.display !== 'none' && cs.visibility !== 'hidden' &&
                     parseFloat(cs.opacity) > 0.01
        };
    }
    return out;
};

boot();
</script>
</body>
</html>
