<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sidebar row edge harness</title>
<!--
  "also the border on the sidebar. get rid of the thick left bar like on
  the homepage and clean it like the homepage looks now"

  MEASURE THE EDGE, DO NOT ASSERT THE RULE. Three features in this repo
  shipped visibly broken through fully green suites whose assertions read
  markup, so the verifier that drives this page
  (scripts/verify_sidebar_row_edges.py) screenshots real pixels of each
  row's left and right edge bands and requires them to MATCH. A left bar
  of any width, from any stylesheet, breaks that symmetry; a grep for a
  deleted declaration cannot, because it cannot see what a later
  stylesheet paints.

  Stylesheet ORDER here is the shipped order and it is load bearing.
  session-sidebar-density.css and session-theme-tint.css both match
  `.session-sidebar-row[...]` at the same specificity, so source order is
  the only thing that decides between them, and it is the specific thing
  that used to make a pinned row's rail vanish whenever the row also
  carried a session theme.

  FIVE ROWS, because the states used to paint through DIFFERENT
  stylesheets and one row can only ever prove one of them:
    plain         nothing set - the baseline every other row is read against
    pinned        session-sidebar-density.css drew a 2px inset accent rail
    active        the current session; never had a rail, and must still be
                  tellable apart from plain after the rails are gone
    themed        session-theme-tint.css drew a 3px inset rail plus a 1px
                  ring - this is the bar that was actually on screen
    pinned-themed both at once, the combination where the pinned rail was
                  already being silently replaced

  #control-rail is a POSITIVE CONTROL. It paints a 3px inset accent rail
  on purpose. A sampler that reported "left matches right" everywhere
  because it was broken would pass every row for the wrong reason and
  manufacture a green inside the verification step, which is the worst
  place for one. The control makes that failure visible.

  Serve over http from the repo root:
    http://127.0.0.1:<port>/tests/manual/sidebar-row-edges-harness.html
  A file:// origin cannot fetch the theme manifests.

  Poll window.__edgesReady before measuring.
-->
<link rel="stylesheet" href="../../client/css/styles.css" />
<link rel="stylesheet" href="../../client/css/session-sidebar.css" />
<link rel="stylesheet" href="../../client/css/status-dot.css" />
<link rel="stylesheet" href="../../client/css/session-sidebar-density.css" />
<link rel="stylesheet" href="../../client/css/session-sidebar-groups.css" />
<link rel="stylesheet" href="../../client/css/session-theme-tint.css" />
<!-- The SHIPPED emitter. Session identity is no longer an edge fact - it
     is a swatch inside the row - so this page has to render the real one
     for check_identity_survives to have anything to measure. -->
<script src="../../client/js/session-theme-tint.js"></script>
<style>
  /* The harness page carries no colour opinion of its own: the backdrop
     is painted from the active theme's --color-bg by __applyTheme, so a
     sampled pixel composites against the same backdrop the real sidebar
     has rather than against a white default. */
  body { margin: 0; padding: 24px; }

  /* THE POSITIVE CONTROL. Deliberately the exact shape under test - a
     3px inset inline-start rail - so the sampler has to be able to SEE
     one for this run to be believed. */
  #control-rail {
      box-shadow: inset 3px 0 0 var(--color-accent);
  }
</style>
</head>
<body>
<!-- `--open` is the panel's REAL open state, not a positioning
     override invented for the harness: the panel is `position: fixed`
     with `transform: translateX(-100%)` closed, so a harness that hand-
     rolled its own layout here would measure rows that never lay out
     that way in the app. -->
<div class="session-sidebar-panel session-sidebar-panel--open" data-density="cozy" id="panel">
  <div class="session-sidebar-row" id="row-plain"
       data-active="0" data-pinned="0">
    <div class="session-sidebar-row-main">
      <span class="status-dot status-dot--idle"></span>
      <span class="session-sidebar-row-name">plain</span>
    </div>
  </div>

  <div class="session-sidebar-row" id="row-pinned"
       data-active="0" data-pinned="1">
    <div class="session-sidebar-row-main">
      <span class="status-dot status-dot--idle"></span>
      <span class="session-sidebar-row-name">pinned</span>
    </div>
  </div>

  <div class="session-sidebar-row" id="row-active"
       data-active="1" data-pinned="0">
    <div class="session-sidebar-row-main">
      <span class="status-dot status-dot--idle"></span>
      <span class="session-sidebar-row-name">active</span>
    </div>
  </div>

  <!-- The inline custom properties are what client/js/session-theme-tint.js
       writes per row at runtime; hardcoding a pair here keeps the tint
       layer's geometry under measurement without booting the whole app.
       A green accent on purpose: the bar the user actually reported was a
       GREEN outline on one row, and it was this. -->
  <div class="session-sidebar-row" id="row-themed"
       data-active="0" data-pinned="0" data-session-theme="green_crt"
       style="--session-theme-accent: #33ff66; --session-theme-ring: rgba(51, 255, 102, 0.45); --session-theme-wash: rgba(51, 255, 102, 0.10);">
    <div class="session-sidebar-row-main">
      <span class="status-dot status-dot--idle"></span>
      <span class="session-sidebar-row-name">themed</span>
    </div>
  </div>

  <div class="session-sidebar-row" id="row-pinned-themed"
       data-active="0" data-pinned="1" data-session-theme="green_crt"
       style="--session-theme-accent: #33ff66; --session-theme-ring: rgba(51, 255, 102, 0.45); --session-theme-wash: rgba(51, 255, 102, 0.10);">
    <div class="session-sidebar-row-main">
      <span class="status-dot status-dot--idle"></span>
      <span class="session-sidebar-row-name">pinned + themed</span>
    </div>
  </div>

  <div class="session-sidebar-row" id="control-rail"
       data-active="0" data-pinned="0">
    <div class="session-sidebar-row-main">
      <span class="status-dot status-dot--idle"></span>
      <span class="session-sidebar-row-name">control: rail on purpose</span>
    </div>
  </div>
</div>

<script>
window.__edgesReady = false;

/**
 * Apply one shipped theme's cssVars to :root, exactly as the real theme
 * loader does, by reading the theme's OWN manifest off disk.
 *
 * Hardcoding a palette here would test a palette this app does not ship.
 * The manifest is fetched so a theme whose tokens change cannot leave a
 * stale copy passing in this file.
 *
 * @param {string} id - theme directory name, e.g. "terminal".
 * @returns {Promise<object>} the cssVars map that was applied.
 */
window.__applyTheme = async function (id) {
    const res = await fetch('../../client/css/themes/' + id + '/theme.json');
    if (!res.ok) throw new Error('theme manifest ' + id + ' -> HTTP ' + res.status);
    const manifest = await res.json();
    const vars = manifest.cssVars || {};
    const root = document.documentElement;
    Object.keys(vars).forEach((k) => root.style.setProperty(k, vars[k]));
    root.setAttribute('data-theme', id);
    document.body.style.background = vars['--color-bg'] || '#000000';
    return vars;
};

/**
 * Resolve a custom property off :root to its computed value.
 * @param {string} name - e.g. "--color-border".
 * @returns {string} the trimmed value, "" when the property is unset.
 */
window.__token = function (name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
};

/**
 * Geometry and computed paint for one row.
 *
 * The rect is reported in DEVICE-ALIGNED integers because every pixel the
 * verifier samples is addressed as an offset from the row's left or right
 * edge, and a fractional origin would slide those samples off the band
 * they were chosen to land on.
 *
 * @param {string} id - element id.
 * @returns {?object} null when the element is absent.
 */
window.__row = function (id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    var sw = el.querySelector('.session-theme-swatch');
    return {
        id: id,
        rect: {
            x: Math.round(r.left), y: Math.round(r.top),
            w: Math.round(r.width), h: Math.round(r.height),
        },
        swatch: sw ? {
            x: Math.round(sw.getBoundingClientRect().left),
            y: Math.round(sw.getBoundingClientRect().top),
            w: Math.round(sw.getBoundingClientRect().width),
            h: Math.round(sw.getBoundingClientRect().height),
        } : null,
        boxShadow: cs.boxShadow,
        borderLeftColor: cs.borderLeftColor,
        borderLeftWidth: cs.borderLeftWidth,
        borderTopColor: cs.borderTopColor,
        backgroundColor: cs.backgroundColor,
    };
};

/** @returns {object} the whole measurement bundle for the current theme. */
window.__edges = function () {
    return {
        hidden: document.hidden,
        visibilityState: document.visibilityState,
        innerWidth: window.innerWidth,
        theme: document.documentElement.getAttribute('data-theme'),
        tokens: {
            border: window.__token('--color-border'),
            bg: window.__token('--color-bg'),
            accent: window.__token('--color-accent'),
        },
    };
};

/**
 * Give every `data-session-theme` row the swatch the real row builders
 * emit, using the shipped module rather than a hardcoded copy of what it
 * is believed to produce.
 *
 * The inline `--session-theme-*` properties above stay hardcoded on
 * purpose - they are the geometry under test - but the swatch is the
 * thing check_identity_survives now samples, so a builder that stopped
 * emitting one must be able to fail this page.
 *
 * @returns {void}
 */
window.__paintSwatches = function () {
    window.Themes = {
        listAll: function () {
            return [{
                id: 'green_crt',
                name: 'Green CRT',
                cssVars: { '--color-accent': '#33ff66' },
            }];
        },
    };
    var rows = document.querySelectorAll('[data-session-theme]');
    for (var i = 0; i < rows.length; i++) {
        var old = rows[i].querySelector('.session-theme-swatch');
        if (old) old.parentNode.removeChild(old);
        rows[i].querySelector('.session-sidebar-row-main')
            .insertAdjacentHTML('beforeend',
                window.SessionThemeTint.swatchHtml('green_crt'));
    }
};

(async () => {
    await window.__applyTheme('terminal');
    window.__paintSwatches();
    window.__edgesReady = true;
})();
</script>
</body>
</html>
