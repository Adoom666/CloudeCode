
# Secret scanning.
#
# Triggers: every push to any branch, and every pull_request (including from
# forks). Uses no secrets, so it cannot be bypassed by pushing from a fork, and
# it does not depend on any contributor having a local pre-commit hook.
#
# Why this matters more here than in a normal repo: this public repository is
# populated by COPYING FILES out of a private one. There is no shared history
# to diff against, so nothing structural stops a credential riding along in a
# copied file. This job is the backstop.
#
# Scope: the CHECKED-OUT TREE, not full git history. Rationale in docs/ci.md.
name: secret scan

on:
  push:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The scan targets the working tree, so a shallow checkout is enough.
          fetch-depth: 1

      - name: Install gitleaks
        # Pinned by version AND by checksum. A security tool fetched over the
        # network without verification is a supply-chain hole in the thing
        # meant to close one. To upgrade: bump the version, then take the new
        # digest from the release's gitleaks_<version>_checksums.txt.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --silent --show-error --fail --location "${url}" --output "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        # --redact keeps any hit out of the public log; the rule id, file and
        # line number are enough to find it. Exit code 1 means leaks found.
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload scan report
        # Runs even when the scan failed; the report is how you triage a hit
        # without the raw value being printed into the log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
