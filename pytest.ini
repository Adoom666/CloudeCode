[pytest]
# Keep pytest's own collection walk out of build output and vendored
# dependency trees.
#
# Without this, a local checkout with macOS/dist.nosync/ built (the
# electron-builder output, which embeds a full copy of src/ inside
# "Cloude Code.app/Contents/Resources/") makes pytest collect the SAME
# module path (src.core.test_write_guard, src.core.*) from two different
# files on disk. Whichever one Python's import system resolves first gets
# cached in sys.modules under the name "src.core", and every subsequent
# "from src.core import <real submodule>" in the actual test suite then
# fails with ImportError/ModuleNotFoundError against the WRONG package -
# not because the code is broken, but because pytest walked into a build
# artifact that happens to mirror the same package layout.
#
# Measured 2026-08-31: with macOS/dist.nosync/ present, a bare
# `pytest -q` collects 42 errors, all ImportError/ModuleNotFoundError
# against src.core.*, and every one clears once these directories are
# excluded from collection. This is invisible in CI and in any checkout
# that has never run the macOS packaging build - exactly the class of
# local-only false signal this project's own hazard notes warn about.
#
# .worktrees and venv.nosync widen the same fix for the same reason: a
# `git worktree add .worktrees/<x>` checkout duplicates the whole tests/
# tree on disk (pytest then fails collection with "import file mismatch"
# because two files share the module name tests.test_x), and venv.nosync
# is this project's real venv/ directory (venv is a symlink to it, see
# the top-level .gitignore note on the .nosync/symlink pairing).
norecursedirs =
    .git
    build
    build.nosync
    macOS/dist
    macOS/dist.nosync
    macOS/node_modules
    macOS/node_modules.nosync
    scripts/codemirror-vendor/node_modules
    scripts/codemirror-vendor/node_modules.nosync
    node_modules
    venv
    venv.nosync
    .venv
    .worktrees
